plugins { id 'com.android.application' }

// The web app address and signing key come from the GitHub build (see .github/workflows/build-apk.yml)
def appUrl = System.getenv('APP_URL') ?: 'https://example.github.io/'
def buildNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.amitek.attendance'
    compileSdk 34
    defaultConfig {
        applicationId 'com.amitek.attendance'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1.0.${buildNo}"
        resValue 'string', 'app_url', appUrl
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'none.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'amitek'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'   // push messages; the project settings are given in AmkApp (no google-services.json)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'   // the phone has org.json built in; plain unit tests on a computer need it added
}
