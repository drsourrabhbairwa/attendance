          SRC
          tar -xzf app-src/src.tgz -C app-src && rm app-src/src.tgz

      - name: Check the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (Settings → Secrets and variables → Actions) and run again."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/amitek.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        working-directory: app-src
        env:
          APP_URL: ${{ inputs.app_url }}
          KEYSTORE_FILE: ${{ runner.temp }}/amitek.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../amitek-attendance.apk

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ github.run_number }}.${{ github.run_attempt }}" amitek-attendance.apk \
            --repo "${{ github.repository }}" --latest \
            --title "Amitek Attendance app (build ${{ github.run_number }}.${{ github.run_attempt }})" \
            --notes "Download amitek-attendance.apk on the Android phone and install it."
          echo "### Download link for employees" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/amitek-attendance.apk" >> "$GITHUB_STEP_SUMMARY"
