# Builds the Amitek Attendance Android app (APK) from the android/ folder and publishes it as a GitHub Release.
# It runs by itself whenever the app source in android/ changes on the main branch, and can also be run by hand:
# "Actions" tab -> "Build Android app" -> "Run workflow".
# The phones then see the new release inside the app (Me -> App Store) and update themselves with one tap.
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_B64       the app's signing key (keep the same key for every build, or phones can't update)
#   KEYSTORE_PASSWORD  its password
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-app.yml"
  workflow_dispatch:
    inputs:
      app_url:
        description: "Web address of the attendance page"
        required: false
        default: "https://drsourrabhbairwa.github.io/attendance/"
      notes:
        description: "What is new (shown to employees in the App Store)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check the app's own tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Check the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (Settings -> Secrets and variables -> Actions) and run again."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/amitek.jks"

      - name: Build the app
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || 'https://drsourrabhbairwa.github.io/attendance/' }}
          KEYSTORE_FILE: ${{ runner.temp }}/amitek.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../amitek-attendance.apk

      - name: Publish the download
        env:
          GH_TOKEN: ${{ github.token }}
          TYPED_NOTES: ${{ inputs.notes }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="app-v${{ github.run_number }}.${{ github.run_attempt }}"
          # What employees read in the App Store: the text typed for a manual run, else android/release-notes.txt, else the commit message (without its tool/co-author footer lines)
          if [ -n "$TYPED_NOTES" ]; then printf '%s\n' "$TYPED_NOTES" > notes.txt
          elif [ -s android/release-notes.txt ]; then cp android/release-notes.txt notes.txt
          else printf '%s\n' "${COMMIT_MESSAGE:-A new version of the app.}" | grep -viE '^(co-authored-by|claude-session|signed-off-by):' > notes.txt || true
          fi
          [ -s notes.txt ] || echo "A new version of the app." > notes.txt
          gh release create "$TAG" amitek-attendance.apk \
            --repo "${{ github.repository }}" --latest \
            --title "Amitek Attendance app (build ${{ github.run_number }}.${{ github.run_attempt }})" \
            --notes-file notes.txt
          echo "### Download link (first install only)" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/amitek-attendance.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Phones that already have the new app update from Me -> App Store." >> "$GITHUB_STEP_SUMMARY"
