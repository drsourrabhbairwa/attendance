# Builds the Amitek Attendance Android app (APK) and publishes it as a download.
# Run it from the "Actions" tab → "Build Android app" → "Run workflow".
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_B64       the app's signing key (keep the same key for every build, or phones can't update)
#   KEYSTORE_PASSWORD  its password
name: Build Android app

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Web address of your attendance page (e.g. https://yourname.github.io/attendance/)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unpack the app source (Java code of the app, stored below)
